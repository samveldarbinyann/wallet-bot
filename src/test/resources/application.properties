# Test overrides so Spring context loads without local .env
encryption.password=test-encryption-password-32chars!!
encryption.salt=0123456789abcdef
telegram.bot.token=123456:TEST_TOKEN_FOR_CONTEXT_LOAD
# Avoid empty DB_URL env var clearing the JDBC URL (Spring ${VAR:default} yields "" if VAR is set empty)
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet_bot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
swap.providers.simpleswap.url=https://api.simpleswap.io
swap.providers.simpleswap.key=test-simpleswap-key
swap.providers.simpleswap.enabled=true
jwt.secret=test-jwt-secret-key-at-least-32-chars-long!!
jwt.expiration-hours=1
intent.secret=test-intent-secret-key-at-least-32-chars-long!!
security.pin-pepper=test-pin-pepper-32-characters-long!!
# Do not call Telegram API during tests (fake token would get 401)
spring.autoconfigure.exclude=org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration
# News refresh scheduler off in tests: gated by news.refresh.enabled, so no background
# context-load tick reaches out to external RSS providers.
news.refresh.enabled=false
