ui.legal.title=Legal
ui.legal.last_updated=Last updated: May 26, 2026
ui.legal.terms.title=Terms of Service
ui.legal.terms.acceptance.h=Acceptance
ui.legal.terms.acceptance.p=By using UNIT Wallet (the "Service") you accept these Terms of Service and our Privacy Policy. If you do not agree with any part of them, do not use the Service.
ui.legal.terms.service.h=Service and key storage
ui.legal.terms.service.p=UNIT Wallet is a Telegram Mini App that lets you create and use crypto wallets across Bitcoin, Ethereum, BNB Chain, Solana, TON, Tron and major stablecoins (USDT, USDC). Private keys are generated on our server, encrypted at rest in our database, and used to sign transactions on your behalf. You can export your private keys at any time from Settings → Export keys. Until you export your keys to your own storage, the safety of your funds depends both on the security of our infrastructure and on the security of your Telegram account. We make best efforts to protect your data, but no system is guaranteed to be impenetrable.
ui.legal.terms.duties.h=Your responsibilities
ui.legal.terms.duties.p=You are responsible for keeping your Telegram account secure, for protecting your PIN, your 2FA secret and any exported private keys, for verifying every recipient address and the network before sending funds, and for never sharing one-time codes, intent tokens or session credentials with anyone — including persons claiming to represent UNIT.
ui.legal.terms.finality.h=Transaction finality
ui.legal.terms.finality.p=Blockchain transactions are final. We cannot reverse, refund, cancel or modify a transaction once it has been broadcast to a network. If you send funds to a wrong address or on a wrong network, the funds are likely lost. If you set a fee too low, your transaction may stall and we do not accelerate or replace user transactions.
ui.legal.terms.disclaimer.h=Disclaimer and limitation of liability
ui.legal.terms.disclaimer.p=The Service is provided "as is" and "as available", without warranties of any kind, express or implied. We are not liable for losses caused by market volatility, mistakes in choosing addresses or networks, actions of third parties (RPC providers, SimpleSwap, mail providers), outages of Telegram or any third party, force majeure, or any other circumstances beyond our reasonable control. To the maximum extent permitted by law, our aggregate liability for any claim related to the Service is limited to the fees you actually paid us during the 30 days preceding the event giving rise to the claim.
ui.legal.terms.prohibited.h=Prohibited use and termination
ui.legal.terms.prohibited.p=You may not use the Service for money laundering, terrorism financing, sanctions evasion, fraud or any other illegal activity. We may freeze, restrict or close an account at our reasonable discretion if we detect suspicious activity, receive a lawful order, or need to comply with applicable laws. You may stop using the Service at any time and request deletion of your data via support.
ui.legal.privacy.title=Privacy Policy
ui.legal.privacy.data.h=Data we collect
ui.legal.privacy.data.p=We process: your Telegram identifier and the public profile fields Telegram shares with us (username, name, language, photo); the addresses of the crypto wallets generated for you and their private keys (encrypted at rest); your email address if you bound one for OTP (also encrypted at rest); a salted and peppered hash of your PIN — the original PIN is never stored; your address book entries; transaction history that is publicly visible on-chain, cached for display; technical request data such as IP address, device type and timestamps; operational and security logs.
ui.legal.privacy.purposes.h=Purposes
ui.legal.privacy.purposes.p=We use this data to authenticate you and maintain your session, to create and operate your wallets, to send transaction notifications via Telegram, to protect users from abuse (rate-limiting, anti-fraud), to respond to support requests, and to meet our legal obligations.
ui.legal.privacy.thirdparty.h=Third parties
ui.legal.privacy.thirdparty.p=We share the minimum data needed with: Telegram (for authentication via initData, bot notifications and Mini App delivery); blockchain RPC providers (Alchemy, Helius, TON, Tron) — they receive addresses and transaction hashes but never your private keys; SimpleSwap when you initiate a cross-network swap (source/destination address and amount); the SMTP provider when an OTP is sent to your email; law enforcement only upon a valid lawful request. We do not sell your data and we do not use it for advertising.
ui.legal.privacy.security.h=Storage and security
ui.legal.privacy.security.p=Private keys and the bound email are encrypted before they are written to the database (AES). PINs are stored only as salted and peppered hashes. All connections use TLS. Access to the production environment is restricted to a small number of authorised engineers. Security-relevant events are logged.
ui.legal.privacy.retention.h=Retention
ui.legal.privacy.retention.p=We keep your data for as long as your account is active. If you delete your account via support, operational data is removed within 90 days, except records we are legally required to retain (for example, for anti-money-laundering compliance). Blockchain transactions cannot be deleted — they remain on the public ledger forever by design of the blockchain.
ui.legal.privacy.rights.h=Your rights
ui.legal.privacy.rights.p=You can request access to your personal data, export your private keys at any time via Settings → Export keys, revoke your session and reset access via PIN and 2FA, request deletion of your account, and lodge a complaint with a supervisory authority in your jurisdiction. To exercise these rights, contact us via Settings → Help & Support.
ui.legal.risk.title=Risk Disclosure
ui.legal.risk.volatility.h=Volatility
ui.legal.risk.volatility.p=Crypto prices change rapidly. The value of your holdings can rise or fall significantly within minutes. Past performance does not guarantee future results. Only hold what you can afford to lose.
ui.legal.risk.finality.h=Finality of transactions
ui.legal.risk.finality.p=On-chain transactions are irreversible. Sending to the wrong address, to the wrong network (for example USDT-ERC20 instead of USDT-TRC20), or with an insufficient fee may lead to a permanent loss of funds. Always double-check the address and the network — copy/paste errors and clipboard-replacing malware are common causes of losses.
ui.legal.risk.keys.h=Key security
ui.legal.risk.keys.p=After you export a private key or seed phrase, you become the sole custodian of those funds. Losing your key means losing your funds — nobody, including UNIT, can recover a wallet without its private key. Never store keys in cloud notes, screenshots, chats or other locations accessible to attackers.
ui.legal.risk.hosted.h=Hosted-wallet risk
ui.legal.risk.hosted.p=While your keys are stored on our servers (that is, before you export them), the safety of those funds depends on the security of our infrastructure and on the security of your Telegram account. Do not keep amounts that are critical to you on a hosted wallet. For long-term storage of significant balances, export your keys to a wallet you control personally.
ui.legal.risk.technical.h=Technical and counterparty risks
ui.legal.risk.technical.p=Blockchain congestion can delay confirmations and inflate fees beyond expectations. RPC providers (Alchemy, Helius, TON, Tron) may have outages that temporarily limit balance reads or transaction submissions. Telegram outages can make the Mini App unreachable. Swaps are executed by SimpleSwap; rates are set by them and may differ from market mid-prices, and a swap cannot be rolled back once it has started.
ui.legal.risk.phishing.h=Phishing, scams and no advice
ui.legal.risk.phishing.p=Never share your PIN, 2FA secret, private keys or seed phrase with anyone — UNIT staff will never ask for them. Beware of fake support accounts and look-alike Mini Apps. UNIT Wallet does not provide investment, tax or legal advice. The crypto regulatory environment varies by jurisdiction and can change rapidly; complying with the laws of your jurisdiction is your responsibility. The Service is intended only for users who have reached the age of majority in their jurisdiction.
