ui.legal.terms.service.p=UNIT Wallet — это Telegram Mini App, позволяющий создавать и использовать криптовалютные кошельки в сетях Bitcoin, Ethereum, BNB Chain, Solana, TON, Tron и для популярных стейблкоинов (USDT, USDC). Приватные ключи генерируются на нашем сервере, шифруются и хранятся в нашей базе данных, и используются для подписи транзакций по вашему запросу. Вы можете в любой момент экспортировать свои приватные ключи через Настройки → Экспорт ключей. До тех пор, пока вы не вынесли ключи в личное хранилище, безопасность ваших средств зависит как от безопасности нашей инфраструктуры, так и от безопасности вашего Telegram-аккаунта. Мы прилагаем все усилия для защиты данных, однако абсолютной гарантии не существует.
ui.legal.terms.duties.h=Обязанности пользователя
ui.legal.terms.duties.p=Вы обязуетесь хранить в безопасности доступ к своему Telegram-аккаунту, защищать PIN-код, секрет 2FA и любые экспортированные приватные ключи, перед каждой отправкой средств проверять адрес и сеть получателя, а также не передавать никому одноразовые коды, intent-токены и сессионные учётные данные — в том числе лицам, представляющимся командой UNIT.
ui.legal.terms.finality.h=Необратимость транзакций
ui.legal.terms.finality.p=Блокчейн-транзакции необратимы. После того как транзакция отправлена в сеть, мы не можем отменить, возместить, отозвать или изменить её. Если вы отправите средства на неверный адрес или в неверной сети, они, скорее всего, потеряны. Если вы установите слишком низкую комиссию, ваша транзакция может зависнуть — мы не ускоряем и не заменяем пользовательские транзакции.
ui.legal.terms.disclaimer.h=Отказ и ограничение ответственности
ui.legal.terms.disclaimer.p=Сервис предоставляется «как есть» и «по мере доступности», без каких-либо гарантий — прямых или подразумеваемых. Мы не несём ответственности за убытки, вызванные рыночной волатильностью, ошибками при выборе адреса или сети, действиями третьих сторон (RPC-провайдеры, SimpleSwap, почтовые провайдеры), сбоями Telegram или любых третьих лиц, форс-мажором и иными обстоятельствами вне нашего разумного контроля. В максимально допустимой законом мере наша совокупная ответственность по любому требованию, связанному с Сервисом, ограничена суммой комиссий, фактически уплаченных нам в течение 30 дней, предшествующих событию, послужившему основанием для требования.
ui.legal.terms.prohibited.h=Запрещённое использование и блокировка
ui.legal.terms.prohibited.p=Сервис нельзя использовать для отмывания денег, финансирования терроризма, обхода санкций, мошенничества и любой иной незаконной деятельности. Мы имеем право заморозить, ограничить или закрыть аккаунт по обоснованному усмотрению, если выявим подозрительную активность, получим законный запрос или в целях соблюдения применимого законодательства. Вы можете в любой момент прекратить использование Сервиса и запросить удаление своих данных через поддержку.
ui.legal.privacy.title=Политика конфиденциальности
ui.legal.privacy.data.h=Какие данные мы обрабатываем
ui.legal.privacy.data.p=Мы обрабатываем: ваш Telegram-идентификатор и публичные поля профиля, передаваемые Telegram (username, имя/фамилия, язык, фото); адреса криптокошельков, сгенерированных для вас, и связанные с ними приватные ключи (хранятся в зашифрованном виде); ваш email-адрес, если вы привязали почту для OTP (также хранится в зашифрованном виде); защищённый хэш вашего PIN-кода с солью и pepper — сам PIN не сохраняется; записи вашей адресной книги; историю транзакций (публичные блокчейн-данные), кэшируемую для отображения; технические данные запросов — IP-адрес, тип устройства, временные метки; операционные логи и логи безопасности.
ui.legal.privacy.purposes.h=Цели обработки
ui.legal.privacy.purposes.p=Эти данные используются для аутентификации и поддержания сессии, создания и обслуживания ваших кошельков, отправки уведомлений о транзакциях через Telegram, защиты пользователей от злоупотреблений (rate-limiting, антифрод), обработки обращений в поддержку и выполнения наших юридических обязательств.
ui.legal.privacy.thirdparty.h=Передача третьим лицам
ui.legal.privacy.thirdparty.p=Мы передаём минимально необходимые данные: Telegram — для авторизации (initData), уведомлений через бота и доставки Mini App; блокчейн-RPC провайдерам (Alchemy, Helius, TON, Tron) — им передаются адреса и хэши транзакций, но никогда приватные ключи; SimpleSwap — при инициировании кросс-сетевого свопа (адреса источника/назначения и сумма); SMTP-провайдеру — при отправке OTP-кода на ваш email; правоохранительным органам — только по обоснованному официальному запросу. Мы не продаём ваши данные и не используем их в рекламных целях.
ui.legal.privacy.security.h=Хранение и безопасность
ui.legal.privacy.security.p=Приватные ключи и привязанный email шифруются перед записью в базу данных (AES). PIN-коды хранятся только в виде хэшей с солью и pepper. Все соединения защищены TLS. Доступ к продакшен-среде ограничен небольшим числом авторизованных инженеров. События безопасности логируются.
ui.legal.privacy.retention.h=Срок хранения
ui.legal.privacy.retention.p=Мы храним ваши данные, пока ваш аккаунт активен. При удалении аккаунта через поддержку операционные данные удаляются в течение 90 дней — за исключением сведений, которые мы обязаны сохранять по закону (например, в рамках антиотмывочных требований). Блокчейн-транзакции удалить невозможно — они навсегда остаются в публичном реестре по самой природе блокчейна.
ui.legal.privacy.rights.h=Ваши права
ui.legal.privacy.rights.p=Вы можете запросить доступ к своим персональным данным, в любой момент экспортировать приватные ключи через Настройки → Экспорт ключей, завершить сессию и восстановить доступ через PIN и 2FA, запросить удаление аккаунта, а также подать жалобу в надзорный орган своей юрисдикции. Чтобы воспользоваться этими правами, обратитесь к нам через Настройки → Помощь и поддержка.
ui.legal.risk.title=Раскрытие рисков
ui.legal.risk.volatility.h=Волатильность
ui.legal.risk.volatility.p=Цены на криптоактивы меняются стремительно. Стоимость ваших активов может вырасти или упасть на значительные проценты за считанные минуты. Прошлая доходность не гарантирует будущей. Держите в крипте только то, потерю чего вы можете себе позволить.
ui.legal.risk.finality.h=Необратимость операций
ui.legal.risk.finality.p=Транзакции в блокчейне необратимы. Отправка на неверный адрес, в неверной сети (например, USDT-ERC20 вместо USDT-TRC20) или с недостаточной комиссией может привести к безвозвратной потере средств. Всегда дважды проверяйте адрес и сеть — ошибки при копировании адресов и вредоносное ПО, подменяющее буфер обмена, — частые причины потерь.
ui.legal.risk.keys.h=Безопасность ключей
ui.legal.risk.keys.p=После того как вы экспортировали приватный ключ или seed-фразу, вы становитесь единственным хранителем этих средств. Потеря ключа = потеря средств. Никто, включая команду UNIT, не сможет восстановить кошелёк без приватного ключа. Никогда не храните ключи в облачных заметках, скриншотах, чатах и иных местах, доступных злоумышленникам.
ui.legal.risk.hosted.h=Риски hosted-кошелька
ui.legal.risk.hosted.p=Пока ваши ключи находятся на наших серверах (то есть до экспорта), безопасность этих средств зависит от безопасности нашей инфраструктуры и вашего Telegram-аккаунта. Не храните на хостовом кошельке суммы, потеря которых для вас критична. Для долгосрочного хранения значимых сумм экспортируйте ключи в кошелёк, которым управляете лично вы.
ui.legal.risk.technical.h=Технические риски и риски контрагентов
ui.legal.risk.technical.p=Перегрузка сетей блокчейна может задерживать подтверждения и увеличивать комиссии сверх ожиданий. У RPC-провайдеров (Alchemy, Helius, TON, Tron) случаются сбои, временно ограничивающие чтение балансов или отправку транзакций. Сбои Telegram могут сделать Mini App недоступным. Свопы выполняет SimpleSwap; курсы устанавливаются им и могут отличаться от рыночных, а запущенный своп нельзя отменить.
ui.legal.risk.phishing.h=Фишинг, мошенничество и отсутствие рекомендаций
ui.legal.risk.phishing.p=Никогда никому не сообщайте свой PIN-код, секрет 2FA, приватные ключи и seed-фразу — сотрудники UNIT их не запрашивают. Остерегайтесь поддельных аккаунтов «поддержки» и Mini App-имитаций. UNIT Wallet не предоставляет инвестиционных, налоговых и юридических рекомендаций. Регулирование криптовалют различается по юрисдикциям и может быстро меняться; соблюдение законодательства вашей юрисдикции — ваша ответственность. Сервис рассчитан только на пользователей, достигших совершеннолетия в своей юрисдикции.
